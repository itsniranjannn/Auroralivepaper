<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A090C" />
      <stop offset="50%" stop-color="#141324" />
      <stop offset="100%" stop-color="#0A090C" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F2CCB" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2C666E" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#90DDF0" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#531253" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#7F2CCB" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#97D8B2" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)" rx="16" />

  <!-- Stars -->
  <circle cx="120" cy="45" r="1.5" fill="#EDEDF2" opacity="0.6" />
  <circle cx="280" cy="30" r="1" fill="#90DDF0" opacity="0.8" />
  <circle cx="450" cy="55" r="1.8" fill="#EDEDF2" opacity="0.5" />
  <circle cx="720" cy="35" r="1.2" fill="#97D8B2" opacity="0.7" />
  <circle cx="890" cy="60" r="1.5" fill="#EDEDF2" opacity="0.6" />
  <circle cx="600" cy="25" r="2" fill="#90DDF0" opacity="0.9" />

  <!-- Aurora Waves -->
  <path d="M0,160 C250,90 400,210 700,120 C850,75 950,130 1000,110 L1000,240 L0,240 Z" fill="url(#wave2)" filter="url(#glow)" />
  <path d="M0,180 C200,110 450,220 750,130 C880,95 960,150 1000,130 L1000,240 L0,240 Z" fill="url(#wave1)" filter="url(#glow)" />

  <!-- Center Floating Icon / Brand -->
  <g transform="translate(500, 85)" text-anchor="middle">
    <!-- Curved Ribbon Icon -->
    <path d="M-40, -25 C -15,-45 15,-10 40,-30 C 20, -5 -10,-15 -25, -5 C -35,2 -45,-10 -40,-25 Z" fill="#90DDF0" filter="url(#glow)" opacity="0.95" />
    <path d="M-35, -15 C -10,-35 20,0 45,-20 C 25, 5 -5,-5 -20, 5 C -30,12 -40,0 -35,-15 Z" fill="#97D8B2" filter="url(#glow)" opacity="0.85" />

    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#EDEDF2" letter-spacing="4">
      AURORA LIVE PAPER
    </text>
    <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#90DDF0" letter-spacing="2" opacity="0.9">
      BRING YOUR SCREENS TO LIFE WITH FLUID MOTION
    </text>
  </g>
</svg>
